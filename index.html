function showAddMeetingModal() {
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-title">📅 安排会议</div>
    <div class="form-group"><label class="form-label">会议标题</label><input class="form-input" id="mtTitle"></div>
    <div class="form-group"><label class="form-label">日期</label><input class="form-input" type="date" id="mtDate"></div>
    <div class="form-group"><label class="form-label">时间</label><input class="form-input" id="mtTime" placeholder="14:00"></div>
    <div class="form-group"><label class="form-label">地点</label><input class="form-input" id="mtLoc" value="会议室"></div>
    <div class="form-group"><label class="form-label">参会人员</label><input class="form-input" id="mtAtt" value="全体教师"></div>
    <div class="form-group"><label class="form-label">会议纪要</label><textarea class="form-input form-textarea" id="mtMin"></textarea></div>
    <div class="form-group"><label class="form-label">待办任务（每行一个：任务名,负责人,截止日期）</label><textarea class="form-input form-textarea" id="mtTasks" placeholder="完成教学计划,王老师,2026-08-10&#10;收集教材需求,李老师,2026-08-08"></textarea></div>
    <button class="btn btn-primary btn-block" onclick="addMeeting()">创建会议</button>
  `;
  document.getElementById('modalMask').classList.add('active');
}

function addMeeting() {
  const meetingId = Date.now();
  store.meetings.unshift({
    id: meetingId, title: document.getElementById('mtTitle').value || '新会议',
    date: document.getElementById('mtDate').value || new Date().toISOString().split('T')[0],
    time: document.getElementById('mtTime').value || '14:00',
    location: document.getElementById('mtLoc').value, attendees: document.getElementById('mtAtt').value,
    status: '待召开', minutes: document.getElementById('mtMin').value,
  });
  const tasksText = document.getElementById('mtTasks').value;
  if (tasksText.trim()) {
    tasksText.split('\n').forEach(line => {
      const parts = line.split(',');
      if (parts.length >= 2) {
        store.meetingTasks.push({
          id: Date.now() + Math.random(), meetingId, task: parts[0].trim(),
          assignee: parts[1]?.trim() || '待分配', deadline: parts[2]?.trim() || '待定', status: '未完成',
        });
      }
    });
  }
  saveStore(); closeModal(); toast('✅ 会议已创建'); renderMeetingMgmt();
}

function completeMeeting(id) {
  const m = store.meetings.find(me => me.id === id);
  if (m) { m.status = '已完成'; saveStore(); toast('✅ 会议已标记完成'); renderMeetingMgmt(); }
}

function viewMeetingTasks(mid) {
  const tasks = store.meetingTasks.filter(t => t.meetingId === mid);
  const m = store.meetings.find(me => me.id === mid);
  let html = `<div class="modal-title">📋 ${m?.title || ''} · 任务列表</div>`;
  tasks.forEach(t => {
    html += `<div class="check-list-item">
      <div class="checkbox ${t.status==='已完成'?'checked':''}" onclick="toggleMeetingTask(${t.id})">✓</div>
      <div style="flex:1"><b>${t.task}</b><br><small style="color:var(--text-secondary)">${t.assignee} · ${t.deadline}</small></div>
      <span class="tag ${t.status==='已完成'?'green':'orange'}">${t.status}</span>
    </div>`;
  });
  html += tasks.length === 0 ? '<div class="empty"><div class="empty-text">暂无任务</div></div>' : '';
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalMask').classList.add('active');
}

function toggleMeetingTask(id) {
  const t = store.meetingTasks.find(tk => tk.id === id);
  if (t) { t.status = t.status === '已完成' ? '未完成' : '已完成'; saveStore(); }
  // re-render
  const mid = t.meetingId;
  viewMeetingTasks(mid);
}

function completeTask(id) {
  const t = store.meetingTasks.find(tk => tk.id === id);
  if (t) { t.status = '已完成'; saveStore(); toast('✅ 任务已完成'); renderMeetingMgmt(); }
}

function generateMeetingMaterials(id) {
  const m = store.parentMeetings.find(pm => pm.id === id);

  m.materials = ['PPT演示文稿', '发言稿', '幼儿发展报告汇总'];
  saveStore();
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-title">📦 材料生成</div>
    <div class="rich-card">

// 预览新建方案文件
function previewNewPlanFile() {
  const file = document.getElementById('spFileInput').files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { toast('⚠️ 文件不能超过10MB'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    window._spFileData = e.target.result;
    window._spFileName = file.name;
    window._spFileSize = file.size;
    document.getElementById('spFilePreview').innerHTML = '✅ 已选择：' + file.name + ' (' + formatFileSize(file.size) + ')';
  };
  reader.readAsDataURL(file);
}

// 研学方案上传文件
function handleStudyPlanFile(input, planId) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { toast('⚠️ 文件不能超过10MB'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    const plan = store.studyTourPlans.find(p => p.id === planId);
    if (plan) {
      plan.attFileName = file.name;
      plan.attFileData = e.target.result;
      plan.attFileSize = file.size;
      saveStore();
      toast('📤 文件已上传');
      renderStudyTourPlans();
    }
  };
  reader.readAsDataURL(file);
}

function previewMatDocFile() {
  const file = document.getElementById('matDocFileInput').files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { toast('⚠️ 文件不能超过10MB'); return; }
  const reader = new FileReader();
  reader.onload = function(e) {
    window._matDocFileData = e.target.result;
    window._matDocFileName = file.name;
    window._matDocFileSize = file.size;
    document.getElementById('matDocFilePreview').innerHTML = '✅ 已选择：' + file.name + ' (' + formatFileSize(file.size) + ')';
  };
  reader.readAsDataURL(file);
}

    attFileSize: window._matDocFileSize || 0,

  });

// ==================== UTILS ====================
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function closeModal() {
  document.getElementById('modalMask').classList.remove('active');

function showSearch() {
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-title">🔍 全局搜索</div>
    <div class="search-bar"><input type="text" placeholder="搜索所有内容..." id="globalSearch" oninput="doGlobalSearch()"></div>
    <div id="searchResults"></div>
  `;
  document.getElementById('modalMask').classList.add('active');
  setTimeout(() => document.getElementById('globalSearch')?.focus(), 300);
}

function doGlobalSearch() {
  const q = document.getElementById('globalSearch').value.toLowerCase();
  if (!q) { document.getElementById('searchResults').innerHTML = ''; return; }
  let results = [];
  kf(store.teachingPlans).filter(p => p.theme.toLowerCase().includes(q) || p.classes.some(c=>c.includes(q))).forEach(p => results.push(`📚 教学计划：${p.planType} · ${p.group} · ${p.theme}`));
  kf(store.courseResources).filter(r => r.title.toLowerCase().includes(q)).forEach(r => results.push(`📁 课程资源：${r.title}`));
  store.teachers.filter(t => t.name.includes(q) && (!t.kindergarten || t.kindergarten === currentKinder)).forEach(t => results.push(`👩‍🏫 教师：${t.name} · ${t.class}`));
  kf(store.meetings).filter(m => m.title.toLowerCase().includes(q)).forEach(m => results.push(`📅 会议：${m.title}`));
  kf(store.notices).filter(n => n.title.toLowerCase().includes(q)).forEach(n => results.push(`📢 通知：${n.title}`));
  kf(store.enrollmentLeads).filter(l => l.parentName.includes(q)).forEach(l => results.push(`👋 线索：${l.parentName}`));
  kf(store.classPromotions).filter(p => p.class.includes(q)).forEach(p => results.push(`📸 班级宣传：${p.class}`));
  let html = results.slice(0, 20).map(r => `<div class="list-item"><span>${r}</span></div>`).join('');
  document.getElementById('searchResults').innerHTML = html || '<div class="empty"><div class="empty-text">未找到结果</div></div>';
}

// ==================== 待办提醒功能 ====================
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function checkReminders() {
  if (!store || !store.todoItems) return;
  var now = new Date();
  var triggered = [];
  kf(store.todoItems).forEach(function(t) {
    if (t.status !== '进行中') return;
    if (t.reminderTriggered) return;
    if (!t.reminderDateTime) return;
    var remTime = new Date(t.reminderDateTime);
    if (now >= remTime) {
      t.reminderTriggered = true;
      triggered.push(t);
    }
  });
  if (triggered.length > 0) {
    saveStore();
    triggered.forEach(function(t) {
      showReminderAlert(t);
    });
  }
}

function showReminderAlert(t) {
  // 浏览器通知
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification('⏰ 待办提醒：' + t.title, {
        body: '截止日期：' + (t.deadline || '今天') + (t.reminderTime ? ' ' + t.reminderTime : '') + (t.note ? '\n' + t.note : ''),
        tag: 'todo-' + t.id,
        requireInteraction: true
      });
    } catch(e) {}
  }
  // 页面内提醒横幅
  var alert = document.createElement('div');
  alert.className = 'reminder-alert';
  alert.id = 'reminder-' + t.id;
  alert.innerHTML =
    '<div class="ra-icon">🔔</div>' +
    '<div class="ra-content">' +
      '<div class="ra-title">' + t.title + '</div>' +
      '<div class="ra-sub">📅 ' + (t.deadline || '今天') + (t.reminderTime ? ' · ⏰ ' + t.reminderTime : '') + (t.priority === '紧急' ? ' · 🔴紧急' : '') + '</div>' +
    '</div>' +
    '<div class="ra-actions">' +
      '<button class="ra-btn" onclick="toggleTodo(' + t.id + ');dismissReminder(' + t.id + ')">✅完成</button>' +
      '<button class="ra-btn" onclick="dismissReminder(' + t.id + ')">稍后</button>' +
    '</div>';
  document.body.appendChild(alert);
  // 振动提醒
  if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
  // 不自动消失，等用户操作
}

function dismissReminder(id) {
  var el = document.getElementById('reminder-' + id);
  if (el) { el.style.transition = 'transform 0.3s'; el.style.transform = 'translateY(-100%)'; setTimeout(function(){ el.remove(); }, 300); }
}

// 打开应用时检查所有逾期待办（即使没有设提醒时间）
function checkOverdueOnOpen() {
  if (!store || !store.todoItems) return;
  var today = new Date().toISOString().split('T')[0];
  var overdue = kf(store.todoItems).filter(function(t) {
    if (t.status !== '进行中') return false;
    if (t.deadline && t.deadline < today) return true;
    if (t.reminderDateTime && new Date(t.reminderDateTime) < new Date() && !t.reminderTriggered) return true;
    return false;
  });
  if (overdue.length === 0) return;
  // 显示逾期待办汇总横幅
  var banner = document.createElement('div');
  banner.className = 'reminder-alert';
  banner.id = 'overdue-banner';
  banner.style.background = 'linear-gradient(135deg, #FF4757, #FF6B6B)';
  var itemsHtml = overdue.slice(0, 5).map(function(t) {
    return '<div style="margin-top:6px;padding:4px 8px;background:rgba(255,255,255,0.15);border-radius:6px;font-size:12px">' +
      '<b>' + t.title + '</b>' +
      (t.deadline ? ' · 📅 ' + t.deadline : '') +
      (t.priority === '紧急' ? ' · 🔴紧急' : '') +
    '</div>';
  }).join('');
  if (overdue.length > 5) itemsHtml += '<div style="font-size:11px;margin-top:4px;opacity:0.8">还有' + (overdue.length - 5) + '条...</div>';
  banner.innerHTML =
    '<div class="ra-icon">⚠️</div>' +
    '<div class="ra-content">' +
      '<div class="ra-title">你有 ' + overdue.length + ' 条逾期待办</div>' +
      itemsHtml +
    '</div>' +
    '<div class="ra-actions">' +
      '<button class="ra-btn" onclick="dismissReminder(\'overdue-banner\')">知道了</button>' +
    '</div>';
  document.body.appendChild(banner);
  if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
}

// 刷新逾期汇总横幅：完成后自动移除或更新数量
function refreshOverdueBanner() {
  if (!store || !store.todoItems) return;
  var today = new Date().toISOString().split('T')[0];
  var overdue = kf(store.todoItems).filter(function(t) {
    if (t.status !== '进行中') return false;
    if (t.deadline && t.deadline < today) return true;
    if (t.reminderDateTime && new Date(t.reminderDateTime) < new Date() && !t.reminderTriggered) return true;
    return false;
  });
  var banner = document.getElementById('overdue-banner');
  if (overdue.length === 0) {
    // 没有逾期待办了，移除横幅
    if (banner) {
      banner.style.transition = 'transform 0.3s';
      banner.style.transform = 'translateY(-100%)';
      setTimeout(function() { banner.remove(); }, 300);
    }
    return;
  }
  // 还有逾期待办，更新横幅内容
  if (banner) {
    var itemsHtml = overdue.slice(0, 5).map(function(t) {
      return '<div style="margin-top:6px;padding:4px 8px;background:rgba(255,255,255,0.15);border-radius:6px;font-size:12px">' +
        '<b>' + t.title + '</b>' +
        (t.deadline ? ' · 📅 ' + t.deadline : '') +
        (t.priority === '紧急' ? ' · 🔴紧急' : '') +
      '</div>';
    }).join('');
    if (overdue.length > 5) itemsHtml += '<div style="font-size:11px;margin-top:4px;opacity:0.8">还有' + (overdue.length - 5) + '条...</div>';
    banner.innerHTML =
      '<div class="ra-icon">⚠️</div>' +
      '<div class="ra-content">' +
        '<div class="ra-title">你有 ' + overdue.length + ' 条逾期待办</div>' +
        itemsHtml +
      '</div>' +
      '<div class="ra-actions">' +
        '<button class="ra-btn" onclick="dismissReminder(\'overdue-banner\')">知道了</button>' +
      '</div>';
  }
}

// ==================== INIT ====================
async function init() {
  // 0. 加载幼儿园配置（班级等）
  loadKinderConfig();

  // 1. 初始化 CloudBase（异步）
  await initCloudBase();

  // 2. 加载云端数据
  store = await loadStore();

  // 3. 首次使用：把默认数据同步到云端
  if (cloudReady) saveStore();

  const k = getKinder();
  document.getElementById('kinderName').textContent = k.shortName;
  document.getElementById('sidebarKinder').textContent = k.name;
  renderSidebar();
  renderBottomBar();
  renderContent();
  // 启动待办提醒检查（每30秒检查一次）
  checkReminders();
  setInterval(checkReminders, 30000);
  // 打开应用时检查逾期待办
  setTimeout(checkOverdueOnOpen, 1000);
}

init();
